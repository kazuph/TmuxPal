name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: SWIFTPM_DISABLE_SANDBOX=1 swift test --disable-sandbox

      - name: Package
        run: ./Scripts/package_release.sh "${GITHUB_REF_NAME:-manual}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TmuxPal-release
          path: dist/release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true
